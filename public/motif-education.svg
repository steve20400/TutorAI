<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!--
    Motif de fond — gravure scolaire.

    Ce fichier sert de MASQUE CSS, pas d'image : les formes sont noires, et la
    couleur vient de `background-color` (voir .motif-fond dans globals.css).
    C'est ce qui lui permet de suivre les quatre thèmes sans être redessiné.

    La tuile se raccorde : les motifs qui touchent un bord sont dessinés deux
    fois, une fois de chaque côté, pour que les moitiés se rejoignent à la
    répétition. Ne pas déplacer l'un sans déplacer l'autre.

    Vocabulaire volontairement limité : livres, cahiers, ardoises, plumes,
    toits, losanges tressés. Pas d'oeil, pas de triangle, pas de compas — au
    Cameroun ces trois signes évoquent les sectes, et ce produit demande aux
    parents de lui confier leurs enfants.
  -->
  <g fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">

    <g transform="translate(26 30) rotate(-6)">
      <path d="M0 -4 q-5-3-9-1.6 v9 q4-1.4 9 1.6 q5-3 9-1.6 v-9 q-4-1.4-9 1.6 z"/>
    </g>

    <g transform="translate(92 22)">
      <path d="M0 -8 L8 0 L0 8 L-8 0 Z"/>
      <path d="M0 -3.4 L3.4 0 L0 3.4 L-3.4 0 Z" fill="#000" stroke="none"/>
    </g>

    <g transform="translate(134 52) rotate(5)">
      <rect x="-8.5" y="-7" width="17" height="13.5" rx="2.5"/>
      <path d="M-5 -2 h10 M-5 1.8 h6.5" stroke-width="1.4"/>
    </g>

    <g transform="translate(44 80) rotate(-4)">
      <path d="M-6 5 q5.5-8.5 12.5-10.5"/>
      <path d="M6.5 -7 l1.8 4.4 l-4.4-1.1 z" fill="#000" stroke="none"/>
    </g>

    <g transform="translate(104 80)">
      <path d="M-9 2 L0 -6 L9 2"/>
      <path d="M-6.5 8 h13"/>
    </g>

    <g transform="translate(22 126) rotate(4)">
      <rect x="-7" y="-9" width="14" height="18" rx="2"/>
      <path d="M-4 -4 h8 M-4 0 h8 M-4 4 h5" stroke-width="1.4"/>
    </g>

    <g transform="translate(70 132)">
      <path d="M0 -8 L8 0 L0 8 L-8 0 Z"/>
      <path d="M0 -3.4 L3.4 0 L0 3.4 L-3.4 0 Z" fill="#000" stroke="none"/>
    </g>

    <g transform="translate(124 124) rotate(-7)">
      <rect x="-6" y="-8" width="12" height="16" rx="1.5"/>
      <path d="M-3 -8 v16" stroke-width="1.4"/>
    </g>

    <!-- les deux moitiés d'un même losange, de part et d'autre du bord vertical -->
    <g transform="translate(160 100)">
      <path d="M0 -8 L8 0 L0 8 L-8 0 Z"/>
      <path d="M0 -3.4 L3.4 0 L0 3.4 L-3.4 0 Z" fill="#000" stroke="none"/>
    </g>
    <g transform="translate(0 100)">
      <path d="M0 -8 L8 0 L0 8 L-8 0 Z"/>
      <path d="M0 -3.4 L3.4 0 L0 3.4 L-3.4 0 Z" fill="#000" stroke="none"/>
    </g>

    <!-- les deux moitiés d'un même livre, de part et d'autre du bord horizontal -->
    <g transform="translate(74 0) rotate(3)">
      <path d="M0 -4 q-5-3-9-1.6 v9 q4-1.4 9 1.6 q5-3 9-1.6 v-9 q-4-1.4-9 1.6 z"/>
    </g>
    <g transform="translate(74 160) rotate(3)">
      <path d="M0 -4 q-5-3-9-1.6 v9 q4-1.4 9 1.6 q5-3 9-1.6 v-9 q-4-1.4-9 1.6 z"/>
    </g>

  </g>
</svg>
