    <g>
      <rect x="158" y="610" width="54" height="38" rx="6" fill="#141f36" stroke="#e8b366" stroke-width="1.6"/>
      <text x="165" y="626" font-size="8.5" fill="#8fa4c9" font-family="ui-monospace, Menlo, monospace">lim = 2</text>
      <text x="165" y="638" font-size="8.5" fill="#8fa4c9" font-family="ui-monospace, Menlo, monospace">x→+∞</text>
      <circle cx="206" cy="642" r="3" fill="#e8b366"/>
      <text x="158" y="661" font-size="8" fill="#e8b366">3 · calcul</text>
    </g>
