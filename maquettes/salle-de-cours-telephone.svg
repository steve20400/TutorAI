<svg xmlns="http://www.w3.org/2000/svg" width="380" height="780" viewBox="0 0 380 780" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!--
    TUTELA — salle de cours adaptative, rendu téléphone.
    Maquette de référence. Mathématiques, Terminale D, feuille « traceur ».
  -->
  <defs>
