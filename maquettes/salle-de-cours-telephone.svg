      <text x="303" y="106" font-size="7" fill="#a8b3c9">Ngu E.</text>
      <rect x="298" y="118" width="58" height="44" rx="8" fill="#18243c" stroke="#2e3c58"/>
      <text x="303" y="156" font-size="7" fill="#a8b3c9">Nfor A.</text>
    </g>

