    <g>
      <rect x="92" y="610" width="54" height="38" rx="6" fill="#141f36" stroke="#243354"/>
      <path d="M100 620h38M100 628h26M100 636h18" stroke="#4d5f85" stroke-width="1.6" stroke-linecap="round"/>
