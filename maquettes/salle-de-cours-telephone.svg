    <rect x="12" y="56" width="356" height="540" fill="#101a2e"/>
    <g clip-path="url(#plan)">
      <g stroke="#1c2b47" stroke-width="1">
        <path d="M12 100h356M12 148h356M12 196h356M12 244h356M12 292h356M12 388h356M12 436h356M12 484h356M12 532h356M12 580h356"/>
        <path d="M46 56v540M94 56v540M142 56v540M238 56v540M286 56v540M334 56v540"/>
