    </g>
    <g>
      <rect x="290" y="610" width="38" height="38" rx="6" fill="none" stroke="#2c3a58" stroke-dasharray="4 3"/>
      <path d="M309 620v18M300 629h18" stroke="#5d6b88" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- ══ barre d'outils ══ -->
    <rect x="12" y="668" width="356" height="100" fill="#08101d"/>
    <line x1="12" y1="668" x2="368" y2="668" stroke="#1c2740"/>

    <rect x="26" y="684" width="62" height="32" rx="8" fill="#e6ecf7"/>
    <text x="57" y="704" font-size="10" font-weight="600" fill="#0d1524" text-anchor="middle">Traceur</text>

    <g fill="#e6ecf7" font-size="14" text-anchor="middle">
      <rect x="96"  y="684" width="32" height="32" rx="8" fill="#16223a" stroke="#243354"/><text x="112" y="705">∫</text>
      <rect x="134" y="684" width="32" height="32" rx="8" fill="#16223a" stroke="#243354"/><text x="150" y="705">∑</text>
      <rect x="172" y="684" width="32" height="32" rx="8" fill="#16223a" stroke="#243354"/><text x="188" y="705">√</text>
      <rect x="210" y="684" width="38" height="32" rx="8" fill="#16223a" stroke="#243354"/><text x="229" y="704" font-size="11">lim</text>
      <rect x="254" y="684" width="32" height="32" rx="8" fill="#16223a" stroke="#243354"/><text x="270" y="705">∈</text>
      <rect x="292" y="684" width="32" height="32" rx="8" fill="#16223a" stroke="#243354"/><text x="308" y="705">π</text>
      <rect x="330" y="684" width="26" height="32" rx="8" fill="#16223a" stroke="#243354" opacity=".5"/>
    </g>

    <!-- commandes de séance -->
    <rect x="26" y="726" width="94" height="30" rx="8" fill="#16223a" stroke="#243354"/>
    <text x="73" y="745" font-size="9.5" fill="#e6ecf7" text-anchor="middle">Photo du cahier</text>
    <rect x="128" y="726" width="86" height="30" rx="8" fill="#16223a" stroke="#243354"/>
    <text x="171" y="745" font-size="9.5" fill="#e6ecf7" text-anchor="middle">Passer la main</text>
    <rect x="288" y="726" width="34" height="30" rx="8" fill="#16223a" stroke="#243354"/>
    <path d="M298 736h14M298 741h14M298 746h9" stroke="#e6ecf7" stroke-width="1.5" stroke-linecap="round"/>
